[project]
name = "redteam-agent"
version = "0.2.0"
description = "An authorized red-team agent: Kali-in-Docker sandbox + Playwright, driven by OpenRouter free models"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "playwright>=1.44",
    "python-dotenv>=1.0",   # agentic_setup.config.load_local_environment
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29", "cryptography>=42"]
# redteam/server.py (dashboard API) — imported unconditionally there.
server = ["fastapi>=0.110", "uvicorn>=0.29"]
# redteam/proxy.py TLS interception (run-scoped CA); without it the evidence proxy
# degrades to passthrough tunnels with metadata-only records.
proxy = ["cryptography>=42"]
# --semantic-memory (redteam/memory_backend/): HelixDB graph+vector recall instead of
# plain tag matching. Requires Docker (ghcr.io/helixdb/helixdb) for the server, not
# vendored here. See memory_backend/__init__.py for the persistence caveat.
semantic-memory = ["helix-db==0.3.4", "sentence-transformers>=3.0"]

[project.scripts]
redteam = "redteam.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["redteam", "redteam.tools", "redteam.llm", "redteam.llmred", "redteam.sandbox",
            "redteam.bench", "redteam.importers", "redteam.memory_backend", "redteam.swarm",
            "redteam.recon", "agentic_setup"]
package-dir = {"agentic_setup" = "src/agentic_setup"}

[tool.pytest.ini_options]
# prototypes/ holds frozen copies of statefuzz and lab experiments whose test files share
# basenames with the real ones; collecting both makes pytest abort with import mismatches.
testpaths = ["tests", "statefuzz/tests"]
