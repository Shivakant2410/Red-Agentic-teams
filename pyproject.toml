[project]
name = "redteam-agent"
version = "0.2.0"
description = "An authorized red-team agent: Kali-in-Docker sandbox + Playwright, driven by OpenRouter free models"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "playwright>=1.44",
    "python-dotenv>=1.0",   # agentic_setup.config.load_local_environment
    # dashboard/API server (redteam/server.py) — the test suite imports it via
    # fastapi.testclient, so these are hard deps, not extras:
    "fastapi>=0.100",
    "pydantic>=2.5",
    "uvicorn>=0.23",
    # proxy TLS interception (redteam/proxy.py RunCA); without it the proxy
    # degrades honestly to passthrough, but the interception behavior is
    # contract-tested, so the capability's dependency is declared:
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.24"]   # fastapi.testclient needs httpx
# --semantic-memory (redteam/memory_backend/): HelixDB graph+vector recall instead of
# plain tag matching. Requires Docker (ghcr.io/helixdb/helixdb) for the server, not
# vendored here. See memory_backend/__init__.py for the persistence caveat.
semantic-memory = ["helix-db==0.3.4", "sentence-transformers>=3.0"]

[project.scripts]
redteam = "redteam.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
package-dir = {"" = ".", "agentic_setup" = "src/agentic_setup"}

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["redteam*", "agentic_setup*"]
exclude = ["tests*", "lab*"]
namespaces = false
