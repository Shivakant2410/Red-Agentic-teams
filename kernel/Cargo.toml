[package]
name = "llmred-kernel"
version = "0.1.0"
edition = "2021"
description = "llmred computational kernel: dynamic attack-graph planner, evidence/traffic scanner, coverage optimizer. Deterministic JSON over stdio — the kernel computes evidence, indices and plans; it NEVER emits verdicts (the three-verdict contract stays in the auditable Python layer)."

[dependencies]
aho-corasick = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
