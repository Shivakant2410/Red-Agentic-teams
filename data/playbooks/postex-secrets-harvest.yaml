id: postex-secrets-harvest
name: Post-exploitation secrets harvest with redaction discipline
kill_chain: postex
surfaces: [web, api, host]
tech_tags: [postex, secrets]
risk_class: 2
tools: [extract_secrets, record_access, prove_privilege]
prerequisites:
  - "held access (confirmed finding or authenticated session) on the target"
  - "the secrets redactor active (masking both directions is automatic via traffic.py)"
detection_risk: unmeasured
technique: |
  1. extract_secrets on material the held access can reach: config files, env dumps,
     connection strings, key stores, backup archives. The redactor masks credentials
     in evidence before anything is stored.
  2. Every harvested secret is an artifact reference, never a plaintext blob: the
     finding stores WHAT was exposed and WHERE, the operator's artifact store holds
     the redacted transcript.
  3. Try the harvest ONLY where the objective needs it: a secret that doesn't move
     the kill chain is reported as exposure, not exploited further.
  4. Chain upward: a harvested DB credential -> authenticate -> prove the new access
     (prove_privilege) -> the kill chain records the hop with provenance.
verify_hint: |
  Exposure confirmed = the secret was retrievable through the held access, k-of-n
  where repeatable, with the redaction receipt. Impact statements quantify what the
  secret unlocks (the next hop's proof), not the secret itself.
references:
  - "redteam/tools/postex.py"
