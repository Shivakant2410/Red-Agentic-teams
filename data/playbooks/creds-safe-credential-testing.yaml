id: creds-safe-credential-testing
name: Credential testing without lockout carnage (operator material only)
kill_chain: creds
surfaces: [web, api]
tech_tags: [credentials, spray]
risk_class: 2
tools: [authenticate, http_probe, request_approval]
prerequisites:
  - "operator-supplied candidate credentials (leak corpora are operator imports, data_source: operator)"
  - "explicit RoE language permitting credential testing and a lockout/contact protocol"
detection_risk: high
technique: |
  1. Confirm the RoE explicitly covers credential testing; if silent, STOP and ask.
     This playbook is the one most likely to hurt the client's users.
  2. Prefer the client's seeded test accounts; use real-user lockout thresholds
     discovered in enum (error messages, retry headers) as hard guards.
  3. request_approval per credential-testing batch (class 2). Batch = one password
     against N seeded accounts, never N passwords against one account.
  4. Space the batch out; the rate limiter's budget is the ceiling, not the target.
     Stop on the first success and report — do not collect.
  5. Every attempt lands in the audit log; successes go to the access graph and
     straight into a verified proof (what does this identity unlock? record_access).
verify_hint: |
  A working credential is confirmed by what it unlocks (the next playbook), not by
  the login response alone. Detection risk is HIGH here: expect the SOC to notice;
  keep the B4 harness numbers attached to any claim about stealth.
references:
  - "docs/tool-integration-plan.md §2 risk classes"
